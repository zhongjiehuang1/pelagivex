name: Reset Pelagivex history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace old project history
        shell: bash
        run: |
          set -euo pipefail
          old_main=$(git rev-parse HEAD)
          old_tag=$(git rev-parse refs/tags/v0.1.0)
          test "$(git rev-parse HEAD^)" = f76dc3fa37a31c12a519ca971e0b45a801640659
          test "$old_tag" = 23965876ab8aeef49c03fa5b4fd03324661cf795
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan pelagivex-clean
          git rm --cached .github/workflows/reset-history.yml
          git commit -m 'Start Pelagivex project'
          clean_root=$(git rev-parse HEAD)
          git add .github/workflows/reset-history.yml
          git commit -m 'Run one-time history cleanup'
          clean_main=$(git rev-parse HEAD)
          git push --atomic \
            --force-with-lease="refs/heads/main:$old_main" \
            --force-with-lease="refs/tags/v0.1.0:$old_tag" \
            origin "$clean_main:refs/heads/main" "$clean_root:refs/tags/v0.1.0"
